<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bus Tracker & Crowd Prediction App 2.0</title>

    <link rel="stylesheet" href="css/style.css">

    <script src="js/config.js"></script>
</head>

<body>

    <header class="topbar">
        <h1>🚌 Bus Tracker & Crowd Prediction App 2.0</h1>
        <p>Live Bus Tracking • ETA • Crowd Prediction</p>
    </header>

    <main class="dashboard">

        <section class="control-panel">

            <h2>🚌 Bus Tracker</h2>

            <label for="routeSelect">Select Route</label>

            <select id="routeSelect">
                <option value="">Select a route</option>
                <option value="D-3">Route D-3</option>
                <option value="G-3">Route G-3</option>
                <option value="R-4">Route R-4</option>
            </select>

            <div class="status-card">
                <p id="backendStatus">Checking backend...</p>
                <p id="mapStatus">Loading map...</p>
            </div>
            <div class="bus-info" id="busInfo">
                <h3>🚌 Bus Status</h3>

                <p><strong>Route:</strong> <span id="busRoute">-</span></p>

                <p><strong>Current Stop:</strong>
                    <span id="currentStop">-</span>
                </p>

                <p><strong>Next Stop:</strong>
                    <span id="nextStop">-</span>
                </p>

                <p><strong>ETA:</strong>
                    <span id="eta">-</span>
                </p>
            </div>

        </section>

        <section class="map-section">
            <div id="map"></div>
        </section>

    </main>

    <script src="js/config.js"></script>
    <script src="data/routes.js"></script>
    <script src="js/app.js"></script>

</body>
</html>
